# Private overlay on top of upstream deploy/compose/compose.yml (taken from
# UPSTREAM_COMMIT in versions.lock). It only pins images, tunes the small
# host, and bounds logs. Ports, volumes and service names stay upstream's.
#
# The relay port comes from BUZZ_HTTP_PORT=127.0.0.1:3000 in the host env
# file, so the relay listens on loopback only and Tailscale Serve fronts it.
# The only other published port is the pairing sidecar, also on loopback.

x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  relay:
    image: ${BUZZ_IMAGE:?set BUZZ_IMAGE in versions.lock}
    environment:
      BUZZ_DB_POOL_SIZE: "20"
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in versions.lock}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=40
    shm_size: 256m
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE in versions.lock}
    logging: *logging

  minio:
    image: ${SILO_IMAGE:?set SILO_IMAGE in versions.lock}
    logging: *logging

  minio-init:
    image: ${MC_IMAGE:?set MC_IMAGE in versions.lock}
    logging: *logging

  # NIP-AB device pairing sidecar (same image as the relay). Desktop clients
  # find it through BUZZ_PAIRING_RELAY_URL in the relay's NIP-11 document.
  # Loopback only; Tailscale Serve maps https://<fqdn>/pair to it.
  pairing-relay:
    image: ${BUZZ_IMAGE:?set BUZZ_IMAGE in versions.lock}
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    networks:
      - buzz-net
    logging: *logging
